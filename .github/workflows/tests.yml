name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/requirements-training.lock
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: docker compose config

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r config/requirements.lock
      - run: npm ci
        working-directory: web
      - run: npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          PYTHONPATH=src python -m hiresense.cli prepare-backend --data resources/examples/sample.xml --out /tmp/hiresense-test
          PYTHONPATH=src python -m hiresense.cli serve --config /tmp/hiresense-test/backend.json --host 127.0.0.1 --port 8000 > /tmp/hiresense-api.log 2>&1 &
          cd web
          npm run start -- --hostname 127.0.0.1 > /tmp/hiresense-web.log 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null && curl -fsS http://127.0.0.1:3000/ > /dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/hiresense-api.log /tmp/hiresense-web.log; exit 1; fi
          npx playwright test tests/journey.e2e.ts
