services:
  hiresense:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hiresense-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
  web:
    build: ./web
    environment:
      HIRESENSE_API_URL: http://hiresense:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      hiresense:
        condition: service_healthy
volumes:
  hiresense-data:
