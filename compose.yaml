services:
  hiresense:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SCHOLARGRAPH_STT_PROVIDER: ${SCHOLARGRAPH_STT_PROVIDER:-vosk}
      SCHOLARGRAPH_TTS_PROVIDER: ${SCHOLARGRAPH_TTS_PROVIDER:-auto}
      SCHOLARGRAPH_SPEECH_BASE_URL: ${SCHOLARGRAPH_SPEECH_BASE_URL:-https://api.openai.com/v1}
      SCHOLARGRAPH_SPEECH_API_KEY: ${SCHOLARGRAPH_SPEECH_API_KEY:-}
      SCHOLARGRAPH_STT_MODEL: ${SCHOLARGRAPH_STT_MODEL:-whisper-1}
      SCHOLARGRAPH_TTS_MODEL: ${SCHOLARGRAPH_TTS_MODEL:-tts-1}
      SCHOLARGRAPH_TTS_VOICE: ${SCHOLARGRAPH_TTS_VOICE:-alloy}
      SCHOLARGRAPH_CHAT_PROVIDER: ${SCHOLARGRAPH_CHAT_PROVIDER:-local}
      SCHOLARGRAPH_CHAT_MODEL_PATH: ${SCHOLARGRAPH_CHAT_MODEL_PATH:-/app/data/models/query-understanding.gguf}
      SCHOLARGRAPH_CHAT_BASE_URL: ${SCHOLARGRAPH_CHAT_BASE_URL:-http://127.0.0.1:11434}
      SCHOLARGRAPH_CHAT_MODEL: ${SCHOLARGRAPH_CHAT_MODEL:-qwen2.5:0.5b}
      SCHOLARGRAPH_CHAT_API_KEY: ${SCHOLARGRAPH_CHAT_API_KEY:-}
    volumes:
      - hiresense-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
  web:
    build: ./web
    environment:
      HIRESENSE_API_URL: http://hiresense:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      hiresense:
        condition: service_healthy
volumes:
  hiresense-data:
