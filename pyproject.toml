[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiresense"
version = "0.1.0"
description = "Offline research expert discovery pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "scikit-learn==1.9.1",
    "threadpoolctl==3.7.0",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
local-llm = ["llama-cpp-python==0.3.36"]
training = ["lightgbm==4.6.0"]
voice = ["vosk==0.3.45", "piper-tts==1.3.0"]

[project.scripts]
hiresense = "hiresense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

